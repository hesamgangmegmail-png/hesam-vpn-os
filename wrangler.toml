name = "hesam-vpn-os-api"
main = "worker/src/index.ts"
compatibility_date = "2025-02-14"

[[d1_databases]]
binding = "DB"
database_name = "hesam-vpn-os-db"
database_id = "ee749a9d-989a-4f79-ba8f-506c060b7561"
migrations_dir = "database/migrations"

[vars]
APP_NAME = "HESAM VPN OS"
BOOTSTRAP_ADMIN_USERNAME = "admin"
# Replace with the exact deployed Pages origin before production deployment.
PANEL_ORIGIN = "http://localhost:5173"
# Optional comma-separated additional exact origins; do not use '*'.
ADDITIONAL_ALLOWED_ORIGINS = ""
